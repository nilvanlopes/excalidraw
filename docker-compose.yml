services:
  excalidraw-canvas:
    image: ghcr.io/yctimlin/mcp_excalidraw-canvas:latest@sha256:baa79d4d8ceeb9758b15f1e48c0bc79731e7a45aefb3e766d8071c7b02e6457f
    container_name: excalidraw-canvas
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      excalidraw:
        aliases:
          - excalidraw-canvas
    restart: unless-stopped
    deploy:
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/health',res=>process.exit(res.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

networks:
  excalidraw:
    name: excalidraw
